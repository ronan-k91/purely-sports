[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "purely-sports"
version = "0.1.0"
description = "An AI-assisted sports newsroom proof of concept."
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "fastapi",
    "psycopg[binary]",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "sqlalchemy",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
